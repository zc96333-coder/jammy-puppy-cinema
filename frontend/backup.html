<!doctype html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>电影院 · 数据备份</title><style>body{max-width:880px;margin:48px auto;padding:0 24px;font:15px/1.6 system-ui;color:#222}button{padding:10px 18px;border:1px solid #ddd;background:#f6f6f5;border-radius:8px;cursor:pointer}textarea{display:block;width:100%;box-sizing:border-box;margin-top:20px;padding:16px;border:1px solid #ddd;border-radius:8px;min-height:320px;font:12px/1.5 monospace}a{color:#1456f0}</style></head>
<body><a href="/">← 返回电影院</a><h1>个人数据备份</h1><p>导出当前浏览器里的新增影片、双方评分/短评、编辑记录、回收站和显示列设置。不修改或清除任何数据。</p><p>备份包含个人内容；上传公开仓库后任何人都可查看。本页不会自动上传。</p><button id="export">生成备份</button> <button id="download" disabled>下载 JSON</button><p id="summary" role="status">请点击生成备份。</p><label for="backup-data">备份 JSON（只读）</label><textarea id="backup-data" readonly></textarea>
<script>
const keys=['gongying.addedFilms.v1','gongying.filmEdits.v1','gongying.deletedFilms.v1','gongying.hiddenColumns'];
document.querySelector('#export').onclick=()=>{try{const storage=Object.fromEntries(keys.map(key=>[key,localStorage.getItem(key)]));const parse=(key,fallback)=>{try{return JSON.parse(storage[key]||fallback);}catch{return null;}};const added=parse(keys[0],'[]'),edits=parse(keys[1],'{}'),deleted=parse(keys[2],'[]');const backup={format:'jammy-puppy-cinema-backup',version:1,exportedAt:new Date().toISOString(),origin:location.origin,baseCodeCommit:'6b5eeed344971bfea21b3dc05ddfcb39ec46023c',storage};document.querySelector('#backup-data').value=JSON.stringify(backup,null,2);document.querySelector('#summary').textContent=`已生成：新增影片 ${Array.isArray(added)?added.length:'格式异常'} 条，编辑记录 ${edits&&typeof edits==='object'?Object.keys(edits).length:'格式异常'} 条，回收站 ${Array.isArray(deleted)?deleted.length:'格式异常'} 条。原始存储值完整保留。`;document.querySelector('#download').disabled=false;}catch{document.querySelector('#summary').textContent='读取浏览器存储失败，未生成备份。';}};
document.querySelector('#download').onclick=()=>{const url=URL.createObjectURL(new Blob([document.querySelector('#backup-data').value],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='personal-data-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
</script></body></html>
